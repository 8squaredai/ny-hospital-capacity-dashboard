name: Update hospital bed capacity data

on:
  schedule:
    # 11:00 UTC daily (~7am ET / 6am EDT) -- NY DOH's source dataset typically
    # refreshes overnight, so this runs after that.
    - cron: "0 11 * * *"
  workflow_dispatch: {} # allows a manual "Run workflow" trigger too

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run update script
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ./scripts/update_hospital_data.sh --push
